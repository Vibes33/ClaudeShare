<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeShare</title>
<!--
  Deuxième verrou, après le « jamais d'innerHTML » de render.js. Celui-ci ne
  dépend pas de la discipline du code : même si une injection passait, il n'y a
  pas de script en ligne autorisé, pas d'origine externe joignable, et donc rien
  à exfiltrer vers ailleurs. `script-src 'self'` sans 'unsafe-inline' est ce qui
  fait tout le travail ; le reste ferme les portes de côté.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self';
  img-src 'self' data:;
  connect-src 'self' ws: wss:;
  form-action 'self';
  base-uri 'none'">
<!-- `frame-ancestors` n'est pas ici : le navigateur l'ignore quand elle vient
     d'un `<meta>`, et laisser une directive morte apprend à ignorer la console.
     Elle est posée en en-tête par `server/middleware.py`, avec les autres. -->
<link rel="stylesheet" href="/assets/{{v}}/style.css">
<script type="module" src="/assets/{{v}}/app.js"></script>
</head>
<body>

<!-- L'écran de connexion est peint par `login.js` : le titre est un SVG à trois
     calques, que seul du code peut assembler. Les conteneurs sont ici pour que
     la mise en page existe avant le premier rendu. -->
<section id="login" hidden>
  <div id="titre-connexion"></div>
  <div id="providers"></div>
</section>

<div id="app">
  <!-- Barre flottante : elle ne colle pas au bord, elle se pose au-dessus du
       contenu qui défile dessous. C'est ce décollement qui la fait lire comme
       un objet de verre plutôt que comme un bandeau. -->
  <header id="barre">
    <a href="#/" id="marque">
      <span id="marque-point"></span>
      <span>ClaudeShare</span>
    </a>
    <span id="title"></span>
    <!-- Qui a la parole : dans la barre, et non dans le panneau latéral. C'est
         l'information que tout le monde consulte, alors que le panneau ne sert
         qu'à qui héberge. -->
    <span id="porteur"></span>
    <span id="etat-lien">
      <span id="status-point"></span>
      <span id="status">hors ligne</span>
    </span>
    <!-- Un bouton, pas un libellé : il ouvre le menu de profil. -->
    <button id="who" type="button"></button>
    <button id="ouvrir-cote" type="button" aria-label="Réglages du salon" hidden>
      <span class="barres"></span>
    </button>
  </header>

  <main id="rooms" hidden></main>

  <main id="room" hidden>
    <!-- La colonne de gauche a deux usages, et deux boutons collés pour en
         changer : vos autres salons — avec une pastille sur ceux où Claude a
         répondu pendant qu'on lisait ici — et la discussion entre les personnes
         présentes, qui se tient à côté de Claude sans lui coûter un tour. -->
    <aside id="salons-lat" aria-label="Vos salons">
      <div id="onglets" class="groupe-boutons" role="tablist">
        <button id="onglet-salons" type="button" role="tab">Salons</button>
        <button id="onglet-discussion" type="button" role="tab">Discussion</button>
      </div>
      <div id="liste-salons" role="tabpanel" aria-labelledby="onglet-salons"></div>
      <div id="discussion" role="tabpanel" aria-labelledby="onglet-discussion" hidden>
        <ol id="chat" aria-live="polite"></ol>
        <div id="chat-saisie">
          <textarea id="chat-champ" rows="1" maxlength="2000"
                    placeholder="Écrire aux autres…"></textarea>
        </div>
      </div>
    </aside>

    <!-- La conversation et ce qu'on y écrit : une colonne, qui garde sa largeur
         de lecture quel que soit ce qui l'entoure. -->
    <div id="fil">
      <section id="transcript" aria-live="polite"></section>

      <!-- Une `div` et non un `form` : la CSP interdit les gestionnaires en
           ligne, donc pas de `onsubmit="return false"`, et un vrai formulaire
           rechargerait la page sur Entrée. Tout passe par app.js. -->
      <div id="composer">
        <div id="saisie">
          <!-- Les présents : au-dessus de ce qu'on écrit, pas dans la barre. On
               les regarde en écrivant — c'est à ce moment qu'on veut savoir qui
               lira. -->
          <div id="presents"></div>
          <textarea id="prompt" rows="1" placeholder="Écrire à Claude…"></textarea>
          <div id="saisie-pied">
            <!-- L'avancement de la fenêtre de cinq heures, peint par app.js :
                 l'anneau n'a de sens que quand l'agent a rapporté un quota, et
                 c'est le code qui sait s'il l'a fait. -->
            <span id="quota"></span>
            <button id="joindre" type="button" aria-label="Joindre un fichier">+</button>
            <!-- Deux réglages qui coûtent de l'argent : réservés à qui héberge,
                 donc cachés par défaut et révélés par les droits. -->
            <button id="choix-modele" class="reglage" type="button" hidden></button>
            <button id="choix-effort" class="reglage" type="button" hidden></button>
            <span id="modele"></span>
            <span id="jetons"></span>
            <!-- Deux tracés plutôt que des bordures pivotées : une flèche
                 dessinée à coups de `border` et de `rotate` dépend de l'arrondi
                 des sous-pixels, et se déforme à certaines échelles. -->
            <button id="send" type="button" aria-label="Envoyer">
              <svg class="icone envoi" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20V5M5.5 11.5 12 5l6.5 6.5"/>
              </svg>
              <svg class="icone arret" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="7" y="7" width="10" height="10" rx="2.5"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="actions"></div>
      </div>
    </div>

    <!-- Le panneau ne sert qu'à qui héberge : caché derrière un bouton, il se
         pose par-dessus plutôt que d'amputer la conversation en permanence. -->
    <aside id="cote" hidden>
      <!-- La poignée est en bas à **gauche** : le panneau est ancré à droite,
           donc une poignée en bas à droite — celle que `resize: both` impose —
           l'agrandirait vers l'extérieur de la fenêtre. -->
      <div id="cote-poignee" role="separator" aria-label="Redimensionner le panneau"
           tabindex="0"></div>
      <h2>Hébergement</h2>
      <p id="host"></p>

      <h2>Code du salon</h2>
      <div id="code"></div>

      <h2>Demandes de parole</h2>
      <ol id="requests"></ol>

      <h2>Approbations d'outil</h2>
      <div id="approvals"></div>
    </aside>
  </main>
</div>

<div id="toasts" aria-live="assertive"></div>

</body>
</html>

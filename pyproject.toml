[project]
name = "claudeshare"
version = "0.1.0"
description = "Partager une session Claude Code entre plusieurs personnes, depuis le terminal et le web"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "authlib>=1.3",
    "itsdangerous>=2.2",
]
tui = [
    "textual>=0.85",
    "websockets>=13",
]
# Séparés de `server` : une installation locale sur SQLite n'a aucune raison de
# tirer le pilote Postgres (une roue de plusieurs dizaines de Mo) ni un client
# Redis dont elle ne se servira pas.
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]

[project.scripts]
claudeshare = "claudeshare.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeshare"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Un test de socket qui échoue attend une trame qui n'arrivera jamais : sans
# cette limite il ne rate pas, il **pend**, et c'est toute la suite qui se fige.
# La valeur est très au-dessus du test le plus lent (~0,1 s) : elle n'attrape
# que les blocages francs.
timeout = 30

[tool.ruff]
line-length = 100

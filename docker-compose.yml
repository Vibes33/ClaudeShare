services:
  claudeshare:
    build: .
    image: claudeshare:latest

    ports:
      # Boucle locale : ce fichier seul est le mode « essayer chez soi ».
      # Le relais n'exécute rien, mais il distribue des droits sur les salons
      # des autres : l'exposer demande une terminaison TLS, c'est-à-dire la
      # surcouche `docker-compose.deploy.yml`, qui retire cette publication.
      - "127.0.0.1:${CLAUDESHARE_PORT:-8765}:8765"

    volumes:
      # Le seul état du relais : sa base (identités, salons, appartenances,
      # journal). Aucun dossier de travail à monter, aucun identifiant
      # d'abonnement — les sessions Claude tournent chez les agents.
      - "${CLAUDESHARE_STATE:-./state}:/state"

    environment:
      CLAUDESHARE_AUTH_MODE: "${CLAUDESHARE_AUTH_MODE:-pilot}"
      # Sans clé stable, les sessions navigateur sont perdues à chaque
      # redémarrage (une clé éphémère est générée et un avertissement émis).
      CLAUDESHARE_SECRET_KEY: "${CLAUDESHARE_SECRET_KEY:-}"
      # Applications OAuth. Sans elles, personne ne peut se connecter : il n'y a
      # volontairement aucun mode de contournement.
      CLAUDESHARE_GITHUB_CLIENT_ID: "${CLAUDESHARE_GITHUB_CLIENT_ID:-}"
      CLAUDESHARE_GITHUB_CLIENT_SECRET: "${CLAUDESHARE_GITHUB_CLIENT_SECRET:-}"
      CLAUDESHARE_GOOGLE_CLIENT_ID: "${CLAUDESHARE_GOOGLE_CLIENT_ID:-}"
      CLAUDESHARE_GOOGLE_CLIENT_SECRET: "${CLAUDESHARE_GOOGLE_CLIENT_SECRET:-}"
      # Base et diffusion : par défaut SQLite dans `/state`, et diffusion en
      # mémoire. `docker-compose.deploy.yml` remplace les deux.
      CLAUDESHARE_DATABASE_URL: "${CLAUDESHARE_DATABASE_URL:-}"
      CLAUDESHARE_REDIS_URL: "${CLAUDESHARE_REDIS_URL:-}"
      CLAUDESHARE_DB_SCHEMA: "${CLAUDESHARE_DB_SCHEMA:-create}"

    security_opt:
      - no-new-privileges:true
      # Plus de `seccomp:unconfined`. Il servait à laisser bubblewrap créer un
      # espace de noms pour le bac à sable ; le relais n'exécutant plus de
      # shell, l'arbitrage n'a plus d'objet et le profil par défaut revient.

    restart: unless-stopped

